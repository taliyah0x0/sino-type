<!DOCTYPE html>
<html style="background-color: rgb(226, 199, 140)" id="background">
  <head>
    <title>BobaWay Admin Page</title>
    <link rel="stylesheet" href="/static/styles/sino-type.css">
    <link rel="icon" type="image/x-icon" href="./static/flav_8.png" class="favicon">
    <link rel="apple-touch-icon" sizes="128x128" href="./static/flav_8.png" class="favicon">
    <meta property="og:image" content="./static/flav_8.png">
    <meta property="og:image:type" content="image/png">
    <meta property="og:image:width" content="1024">
    <meta property="og:image:height" content="1024">
    <!-- <meta property="og:description" content="Romanization to Hanzi Keyboard"> -->
  </head>
  <body>
    <form action="#" method="POST">
        <select name="language" required>
          <option value="Shanghainese">Shanghainese</option>
          <option value="Korean">Korean</option>
          <option value="Taiwanese">Taiwanese</option>
          <option value="Vietnamese">Vietnamese</option>
        </select>
        <input type="text" name="hanzi" placeholder="Enter the Hanzi" autocomplete="off" required/>
        <input type="text" name="romanization" placeholder="Enter the romanization" autocomplete="off" required/>
        <input type="submit" value="Submit"/>
    </form>
    <br>
    {% if hanzi %}
      <p>Most recent addition: {{ hanzi }}, {{ roman }} in {{ language }}</p>
    {% endif %}
  </body>
</html>
